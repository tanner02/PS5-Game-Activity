<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 Game Activity</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#edf5f0;background:#121b17}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#25473a,transparent 70%)}
main{width:min(100%,460px);padding:clamp(22px,6vw,38px);border:1px solid #426052;border-radius:24px;background:#17251f;box-shadow:0 24px 70px #0005}
h1{font-size:clamp(1.7rem,6vw,2.2rem);letter-spacing:-.055em;margin:0 0 24px}
h2{font-size:1.2rem;margin:0 0 8px}p{color:#bbcdc3;line-height:1.55;margin:0 0 16px}
button{width:100%;padding:12px 16px;border:1px solid transparent;border-radius:12px;background:#abedca;color:#102b20;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}button:focus-visible{outline:2px solid white;outline-offset:4px}
.secondary{background:transparent;border-color:#4c6c5e;color:#e0eee6;margin-top:12px}
#signout{background:transparent;color:#ffb8ae;border-color:#84574f;margin-top:22px}
#qr{display:block;width:min(100%,224px);height:auto;image-rendering:pixelated;margin:18px auto;border-radius:12px;background:white}
#game{display:flex;gap:12px;align-items:center;background:#22352b;padding:12px;border-radius:12px}
#cover{width:48px;height:48px;border-radius:8px;object-fit:cover}
#error{color:#ffb8ae;margin-top:14px;overflow-wrap:anywhere}
</style>
<script src="/qr.js" defer></script>
<script src="/activity.js" defer></script>
</head>
<body>
<main>
<h1>PS5 Game Activity</h1>
<section id="login">
<p id="status" role="status">Connecting to the console…</p>
<button id="signin" hidden>Sign in with Discord</button>
<canvas id="qr" aria-label="Scan this QR code using the Discord mobile app" hidden></canvas>
<div id="challenge" hidden><button id="verify" class="secondary">Show Discord verification</button><div id="widget"></div></div>
<button id="cancel" class="secondary" hidden>Cancel sign-in</button>
</section>
<section id="account" hidden>
<h2 id="identity">Signed in</h2>
<p id="activity" role="status">Waiting for a game…</p>
<div id="game" hidden><img id="cover" alt="" hidden><strong id="title"></strong></div>
</section>
<button id="signout" hidden>Sign out and delete all credentials</button>
<p id="error" role="alert" hidden></p>
</main>
</body>
</html>
